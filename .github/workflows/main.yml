name: Compile Python
# Python 代码已移入 archive/python，sp.spec 与 requirements 不在根目录，push 触发必然失败，改为仅手动运行
on: [workflow_dispatch]
jobs:
  pyinstaller-build:
    runs-on: windows-latest
    steps:
      - name: Versatile PyInstaller
        uses: sayyid5416/pyinstaller@v1.8.0    
        with: 
         python_ver: '3.10'
         pyinstaller_ver: '==6.3.0'
         spec: 'sp.spec'
         requirements: 'requirements-win-gpu.txt'
         upload_exe_with_name: 'sp1.5'
         options: --name "sp"--windowed
