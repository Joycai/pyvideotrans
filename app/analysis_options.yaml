# 在 flutter_lints 推荐集之上，把代码库已经在遵守的写法固化成规则，
# 免得新代码悄悄换一种风格。只收"现有代码零违规或改几处就齐"的规则；
# discarded_futures、cascade_invocations 这类会在界面回调里制造大量噪音的不开。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # import：lib 内一律相对路径，按 dart: / package: / 相对 分段排序。
    - prefer_relative_imports
    - directives_ordering

    # 字面量与声明
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_final_in_for_each
    - use_super_parameters
    - use_named_constants
    - type_annotate_public_apis
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_breaks
    - unnecessary_statements
    - no_literal_bool_comparisons
    - noop_primitive_operations

    # 异步与资源：不等待的 Future 要用 unawaited() 写明是有意的。
    - unawaited_futures
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - avoid_dynamic_calls

    # 控件
    - sized_box_shrink_expand
    - use_colored_box
    - use_decorated_box
    - use_string_buffers
