name: subtitle_studio
description: "Joycai Subtitle Studio：语音转写、字幕翻译与视频转码的桌面客户端。"
publish_to: 'none'

# 改版本号用 bump-versions skill，打包脚本里还有几处硬编码的副本。
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  material_symbols_icons: ^4.2960.0
  http: ^1.6.0
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  # 只带各平台的 libmpv 原生库，代码里不 import。
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
